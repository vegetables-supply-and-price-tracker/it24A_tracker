<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Market Supply Tracker — Fixed</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="navbar">
    <div class="nav-left"><div class="logo">AgriTrack</div></div>
    <div class="nav-center"><input class="search-bar" placeholder="Search..."></div>
    <div class="nav-right">
      <a href="index.html">Home</a>

      <button id="openWeatherBtn" class="nav-weather-btn">Weather</button>
    </div>
  </nav>

  <h3 class="section-title">Market location</h3>

  <div class="map-weather-wrapper">
    <div id="map"></div>

    <div id="sidebar">
      <h2>Market Info</h2>
      <div id="sidebar-content">Select a marker on the map</div>
    </div>
  </div>

<h3 class="section-title1">General Market Data of each Area</h3>
<button class="filter-btn active" data-time="1_day">1 Day</button>
<button class="filter-btn" data-time="7_day">7 Days</button>

<main class="grid">
    <section class="panel" id="manolo-fortich-panel">
        <h2>Manolo Fortich</h2>
        <div class="panel-content">
            <p>Loading prices...</p>
        </div>
    </section>

    <section class="panel" id="damilag-panel">
        <h2>Damilag</h2>
        <div class="time-filters">
            
        </div>
        <div class="panel-content">
            <p>Loading prices...</p>
        </div>
    </section>

    <section class="panel" id="alae-panel">
        <h2>Alae</h2>
        <div class="panel-content">
            <p>Loading prices...</p>
        </div>
    </section>
</main>

  <!-- weather slide-in -->
  <div id="weatherPanel" aria-hidden="true">
    <button id="closeWeatherBtn" class="close-btn">✖</button>
    <h2>Current Weather</h2>
    <div id="weatherResult">Click Weather in navbar to load</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
